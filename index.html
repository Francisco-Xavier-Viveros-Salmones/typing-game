<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrera de Caballos - Mecanografía P2P</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <!-- PeerJS desde CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Pantalla de Inicio -->
        <div id="screen-home" class="screen active">
            <h1>🏇 TypeRacer Caballos</h1>
            <div class="input-group">
                <label for="nickname">Tu Apodo:</label>
                <input type="text" id="nickname" placeholder="Ej. JineteVeloz" autocomplete="off">
            </div>
            <div class="actions">
                <button id="btn-create-room" class="btn primary">Crear Sala (Host)</button>
            </div>
            <div class="join-section">
                <label for="room-code-input">O únete a una sala existente:</label>
                <div class="join-group">
                    <input type="text" id="room-code-input" placeholder="Ej. ABCDE" autocomplete="off">
                    <button id="btn-join-room" class="btn secondary">Unirse</button>
                </div>
            </div>
        </div>

        <!-- Pantalla de Lobby -->
        <div id="screen-lobby" class="screen">
            <h2>Lobby de Espera</h2>
            <div class="room-info" style="display: flex; justify-content: center; align-items: center; gap: 10px;">
                <p style="margin: 0;">Código de la Sala: <strong id="display-room-code">----</strong></p>
                <button id="btn-copy-code" class="btn secondary" style="padding: 5px 10px; font-size: 0.9em;" title="Copiar código">📋 Copiar</button>
            </div>
            
            <div class="form-group" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="lobby-nickname-input" placeholder="Nuevo Apodo" maxlength="15" autocomplete="off" style="width: auto; margin-top: 0;">
                <button id="btn-change-name" class="btn primary" style="padding: 10px 15px;">Renombrar</button>
            </div>
            
            <div class="players-list-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0;">Jugadores (<span id="player-count">0</span>/6)</h3>
                    <button id="btn-open-modal" class="btn secondary" style="padding: 5px 15px; font-size: 0.9em;">🎨 Cambiar Caballo</button>
                </div>
                <ul id="players-list">
                    <!-- Jugadores aparecerán aquí -->
                </ul>
            </div>
            
            <div id="chat-container" class="chat-container">
                <div id="chat-messages" class="chat-messages"></div>
                <input type="text" id="chat-input" placeholder="Escribe un mensaje y presiona Enter..." maxlength="60" autocomplete="off">
            </div>
            
            <div id="game-settings" class="settings-panel" style="display: none;">
                <h3>⚙️ Reglas de la Partida</h3>
                <div class="setting-row">
                    <label>Rondas:</label>
                    <select id="setting-rounds" disabled>
                        <option value="1">1 Ronda</option>
                        <option value="3">3 Rondas</option>
                        <option value="5">5 Rondas</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Límite de Tiempo:</label>
                    <select id="setting-time" disabled>
                        <option value="0">Sin Límite</option>
                        <option value="30">30 Segundos</option>
                        <option value="60">60 Segundos</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Categoría:</label>
                    <select id="setting-category" disabled>
                        <option value="quotes">Historia y Cultura</option>
                        <option value="jokes">Ciencia y Naturaleza</option>
                        <option value="code">Tecnología y Computación</option>
                        <option value="tongue">Geografía y Universo</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Idioma:</label>
                    <select id="setting-language">
                        <option value="es" selected>Español 🇲🇽🇪🇸</option>
                        <option value="en">English 🇺🇸🇬🇧</option>
                    </select>
                </div>
                <div class="setting-row" style="justify-content: space-between;">
                    <label>Dificultad:
                        <select id="setting-difficulty">
                            <option value="facil">Fácil</option>
                            <option value="normal" selected>Normal</option>
                            <option value="dificil">Difícil</option>
                        </select>
                    </label>
                    <label>Modo de Juego:
                        <select id="setting-mode">
                            <option value="normal">Normal</option>
                            <option value="sudden_death">Muerte Súbita 💀</option>
                            <option value="vidas">Por Vidas ❤️</option>
                        </select>
                    </label>
                </div>
            </div>

            <div id="host-controls" style="display: none;">
                <button id="btn-start-game" class="btn success" disabled>Esperando a que estén listos (50%)</button>
            </div>
            <div id="client-controls" style="display: none;">
                <button id="btn-ready" class="btn primary">Estoy Listo</button>
                <p id="client-waiting-msg" style="display: none; margin-top: 10px;">Esperando al anfitrión...</p>
            </div>
            <div style="margin-top: 20px;">
                <button id="btn-leave-room" class="btn secondary">Salir de la Sala</button>
            </div>
        </div>
        
        <!-- PANTALLA: JUEGO -->
        <div id="screen-game" class="screen">
            <div id="game-options-btn">⚙️</div>
            <div id="game-options-panel" style="display: none;">
                <label style="display:block; margin-bottom:10px;">Volumen: <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="1"></label>
            </div>

            <div class="game-header">
                <h2 id="round-indicator">Ronda 1/3</h2>
                <div style="display: flex; align-items: center;">
                    <span id="game-timer" style="display: none; margin-right: 15px;">⏳ 00:00</span>
                    <button id="btn-abandon" style="background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: auto;">Abandonar Carrera 💀</button>
                </div>
            </div>
            <div id="countdown-container" class="countdown" style="display: none;">3</div>
            
            <div id="race-track-container" class="race-container">
                <!-- Los carriles de los caballos se generarán aquí -->
            </div>

            <div class="typing-section">
                <div id="text-display" class="text-display">
                    <!-- El texto a escribir aparecerá aquí -->
                </div>
                <!-- Input invisible para capturar texto en móviles/teclados especiales -->
                <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="opacity: 0; position: absolute; left: -9999px;">
            </div>
        </div>

        <!-- Pantalla de Resultados -->
        <div id="screen-results" class="screen">
            <h2>Resultados del Torneo</h2>
            <div class="results-table-container">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Posición</th>
                            <th>Jinete</th>
                            <th>WPM</th>
                            <th>Tiempo</th>
                            <th>Errores</th>
                            <th>Pts Ronda</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                        <!-- Resultados generados en JS -->
                    </tbody>
                </table>
            </div>
            
            <div id="next-round-msg" style="display: none; margin-top: 20px;">
                <p>Siguiente ronda en: <strong id="next-round-timer" style="font-size: 1.5em; color: var(--primary);">10</strong> segundos...</p>
            </div>
            
            <div class="actions" style="margin-top: 20px;">
                <button id="btn-back-to-lobby" class="btn secondary">Volver al Lobby</button>
            </div>
        </div>

        <!-- Modal Selección de Caballo -->
        <div id="modal-caballos" class="modal">
            <div class="modal-content">
                <span class="close-modal" id="btn-close-modal">&times;</span>
                <h2>Selecciona tu Corcel</h2>
                <ul id="horse-selection-grid" class="horse-selection-grid">
                    <!-- JS generará aquí la grilla -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/texts.js"></script>
    <script src="js/game.js"></script>
    <script src="js/network.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
